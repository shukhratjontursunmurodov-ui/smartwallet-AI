  <script>
    tailwind.config = {

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F7F9F4; color: #1a1a1a; margin: 0; }
    .font-display { font-family: 'Outfit', sans-serif; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-fadeIn { animation: fadeIn 0.25s ease-out forwards; }
    .animate-slideUp { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function formatAmount(amount, currency = 'KRW') {
      if (isNaN(amount) || amount === null || amount === undefined) amount = 0;
      const rounded = Math.round(amount);
      const formattedNumber = rounded.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return currency === 'KRW' ? `₩${formattedNumber}` : `$${formattedNumber}`;
    }

    // Live input formatter: strips non-digits, adds dot thousands separators
    function formatInputAmount(val) {
      if (val === null || val === undefined || val === '') return '';
      const digits = String(val).replace(/\D/g, '');
      if (!digits) return '';
      return digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    // Parse dot-formatted string back to raw integer
    function parseInputAmount(val) {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      const digits = String(val).replace(/\D/g, '');
      return digits ? parseInt(digits, 10) : 0;
    }

    /**
     * SINGLE SHARED FUNCTION — used by both Home and Analytics.
     * Computes all cycle stats from the same logic, no duplication.
     *
     * @param {Object|null} cycle       - The active cycle object {startDate, days, totalAmount}
     * @param {Array}        allExpenses - Full expenses array
     * @param {string|null}  rangeStart  - Optional date filter start (YYYY-MM-DD). Null = use cycle start.
     * @param {string|null}  rangeEnd    - Optional date filter end (YYYY-MM-DD). Null = use cycle end.
     * @returns {Object} { totalSpent, balanceRemaining, daysInRange, daysRemaining, dailyLimit, avgDaily, cycleEndDate, filteredExpenses }
     */
    function getActiveCycleStats(cycle, allExpenses, rangeStart, rangeEnd) {
      // Compute cycle end date from stored data (local-time safe)
      let cycleEnd = null;
      if (cycle) {
        const [y, m, d] = cycle.startDate.split('-').map(Number);
        cycleEnd = new Date(y, m - 1, d + cycle.days);
      }
      const cycleEndStr = cycleEnd ? cycleEnd.toISOString().split('T')[0] : null;

      // Resolve the effective range
      const effectiveStart = rangeStart || (cycle ? cycle.startDate : new Date().toISOString().split('T')[0]);
      const effectiveEnd   = rangeEnd   || (cycleEndStr || new Date().toISOString().split('T')[0]);

      // Filter expenses within the date range
      const filteredExpenses = allExpenses.filter(exp => {
        const d = exp.date ? exp.date.split('T')[0] : '';
        return d >= effectiveStart && d <= effectiveEnd;
      });

      const totalSpent = filteredExpenses.reduce((s, e) => s + e.amount, 0);
      const balanceRemaining = cycle ? cycle.totalAmount - totalSpent : 0;

      // Parse range dates in local time to avoid UTC drift
      const [sy, sm, sd] = effectiveStart.split('-').map(Number);
      const [ey, em, ed] = effectiveEnd.split('-').map(Number);
      const startD = new Date(sy, sm - 1, sd);
      const endD   = new Date(ey, em - 1, ed);
      const today  = new Date();
      today.setHours(0, 0, 0, 0);

      const daysInRange    = Math.max(1, Math.ceil((endD - startD) / (1000 * 60 * 60 * 24)));
      const daysRemaining  = Math.max(1, Math.ceil((endD - today)  / (1000 * 60 * 60 * 24)));
      const dailyLimit     = Math.max(0, balanceRemaining / daysRemaining);
      const avgDaily       = totalSpent / Math.max(1, daysInRange);

      return {
        totalSpent,
        balanceRemaining,
        daysInRange,
        daysRemaining,
        dailyLimit,
        avgDaily,
        cycleEndDate: cycleEndStr,
        filteredExpenses,
      };
    }

    const translations = {
      en: {
        appName: "SmartWallet AI",
        tagline: "Your daily safe spending guide",
        hero: {
          dailySafeSpend: "You can spend",
          todayLabel: "today",
          daysLeft: "days left in cycle",
          totalBalance: "Balance Remaining",
          withinBudget: "Within limit 🔥"
        },
        cycleSetup: {
          title: "Start New Budget Cycle",
          blockingPrompt: "Enter how much money you have for this cycle to unlock your daily safe-spend limit.",
          amountLabel: "How much money do you have for this cycle?",
          startDateLabel: "Start Date",
          durationLabel: "Custom Cycle Duration",
          confirmButton: "Start Budget Cycle"
        },
        expense: {
          quickAddHeader: "Log New Expense",
          amountLabel: "Amount Spent",
          categoryLabel: "Select Category",
          noteLabel: "Note (Optional)",
          saveButton: "Log Expense"
        },
        categories: {
          utensils: "Food & Dining",
          bus: "Transport",
          book: "Study & Books",
          gamepad: "Entertainment",
          shopping: "Shopping",
          receipt: "Bills & Utilities",
          sparkles: "Personal Care",
          more: "Miscellaneous"
        }
      },
      uz: {
        appName: "SmartWallet AI",
        tagline: "Kunlik xavfsiz xarajat ko'rsatgichingiz",
        hero: {
          dailySafeSpend: "Bugun sarflashingiz mumkin",
          todayLabel: "bugun",
          daysLeft: "tsiklda qolgan kunlar",
          totalBalance: "Qolgan balansi",
          withinBudget: "Limit ichida 🔥"
        },
        cycleSetup: {
          title: "Yangi Byudjet Tsiklini Boshlash",
          blockingPrompt: "Kunlik xavfsiz xarajat limitini aniqlash uchun ushbu tsikl uchun qancha mablag'ingiz borligini kiriting.",
          amountLabel: "Ushbu tsikl uchun qancha pulingiz bor?",
          startDateLabel: "Boshlanish sanasi",
          durationLabel: "Moslashtirilgan Tsikl Davomiyligi",
          confirmButton: "Tsiklni Boshlash"
        },
        expense: {
          quickAddHeader: "Yangi Xarajat Kiritish",
          amountLabel: "Sarflangan summa",
          categoryLabel: "Kategoriyani tanlang",
          noteLabel: "Eslatma (Ixtiyoriy)",
          saveButton: "Xarajatni Saqlash"
        },
        categories: {
          utensils: "Ovqat va Restoranlar",
          bus: "Transport",
          book: "O'qish va Kitoblar",
          gamepad: "Kengayish va O'yinlar",
          shopping: "Xaridlar",
          receipt: "Kommunal to'lovlar",
          sparkles: "Shaxsiy Parvarish",
          more: "Boshqa"
        }
      }
    };

    const INITIAL_CATS = [
      { id: 'c1', key: 'utensils', name: 'Food & Dining' },
      { id: 'c2', key: 'bus', name: 'Transport' },
      { id: 'c3', key: 'book', name: 'Study & Books' },
      { id: 'c4', key: 'gamepad', name: 'Entertainment' },
      { id: 'c5', key: 'shopping', name: 'Shopping' },
      { id: 'c6', key: 'receipt', name: 'Bills & Utilities' },
      { id: 'c7', key: 'sparkles', name: 'Personal Care' },
      { id: 'c8', key: 'more', name: 'Miscellaneous' },
    ];

    function App() {
      const [lang, setLang] = useState(localStorage.getItem('sw_lang') || 'en');
      const [curr, setCurr] = useState(localStorage.getItem('sw_curr') || 'KRW');
      
      const [usdToKrwRate, setUsdToKrwRate] = useState(1467);
      const [rateLastUpdated, setRateLastUpdated] = useState('12:00');

      useEffect(() => {
        const cached = localStorage.getItem('sw_rate_cache');
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (Date.now() - parsed.time < 4 * 60 * 60 * 1000) {
              setUsdToKrwRate(parsed.rate);
              setRateLastUpdated(parsed.updatedStr);
              return;
            }
          } catch(e){}
        }

        fetch('https://open.er-api.com/v6/latest/USD')
          .then(r => r.json())
          .then(data => {
            if (data && data.rates && data.rates.KRW) {
              const r = data.rates.KRW;
              const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              setUsdToKrwRate(r);
              setRateLastUpdated(timeStr);
              localStorage.setItem('sw_rate_cache', JSON.stringify({ rate: r, updatedStr: timeStr, time: Date.now() }));
            }
          })
          .catch(() => {});
      }, []);

      const [cycle, setCycle] = useState(() => {
        const saved = localStorage.getItem('sw_cycle');
        return saved ? JSON.parse(saved) : null;
      });

      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('sw_categories');
        return saved ? JSON.parse(saved) : INITIAL_CATS;
      });

      const [expenses, setExpenses] = useState(() => {
        const saved = localStorage.getItem('sw_expenses');
        return saved ? JSON.parse(saved) : [
          { id: '1', amount: 8500, catId: 'c1', note: 'Campus Cafeteria Lunch', date: new Date().toISOString() },
          { id: '2', amount: 1400, catId: 'c2', note: 'Subway Card', date: new Date().toISOString() }
        ];
      });

      const [showCycleModal, setShowCycleModal] = useState(!cycle);
      const [showExpenseModal, setShowExpenseModal] = useState(false);
      const [editingExpenseId, setEditingExpenseId] = useState(null); // null = new, id = editing
      const [showAddCatModal, setShowAddCatModal] = useState(false);
      const [showEditCycleModal, setShowEditCycleModal] = useState(false);
      const [activeTab, setActiveTab] = useState('home');
      const [selectedCatFilter, setSelectedCatFilter] = useState(null);
      const [expandedHistoryId, setExpandedHistoryId] = useState(null);

      // Cycle history — preserved old cycles
      const [cycleHistory, setCycleHistory] = useState(() => {
        const saved = localStorage.getItem('sw_cycle_history');
        return saved ? JSON.parse(saved) : [];
      });

      const [setupAmount, setSetupAmount] = useState('');
      const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
      const [durationMode, setDurationMode] = useState('endDate');
      const [nextIncomeDate, setNextIncomeDate] = useState(
        new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]
      );
      const [customDays, setCustomDays] = useState('12');

      const [newCatName, setNewCatName] = useState('');

      const [expAmount, setExpAmount] = useState('');
      const [expCat, setExpCat] = useState('c1');
      const [expNote, setExpNote] = useState('');

      // Analytics date-range picker — defaults to the active cycle's actual range
      const initCycleEnd = cycle ? (() => {
        const [y, m, d] = cycle.startDate.split('-').map(Number);
        return new Date(y, m - 1, d + cycle.days).toISOString().split('T')[0];
      })() : new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
      const [analyticsStart, setAnalyticsStart] = useState(cycle?.startDate || startDate);
      const [analyticsEnd, setAnalyticsEnd] = useState(initCycleEnd);

      useEffect(() => { localStorage.setItem('sw_lang', lang); }, [lang]);
      useEffect(() => { localStorage.setItem('sw_curr', curr); }, [curr]);

      useEffect(() => {
        if (cycle) localStorage.setItem('sw_cycle', JSON.stringify(cycle));
        else localStorage.removeItem('sw_cycle');
      }, [cycle]);

      useEffect(() => {
        localStorage.setItem('sw_expenses', JSON.stringify(expenses));
      }, [expenses]);

      useEffect(() => {
        localStorage.setItem('sw_categories', JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        localStorage.setItem('sw_cycle_history', JSON.stringify(cycleHistory));
      }, [cycleHistory]);

      useEffect(() => {
        if (window.lucide) lucide.createIcons();
      });

      const t = (path) => {
        const keys = path.split('.');
        let cur = translations[lang] || translations.en;
        for (const k of keys) {
          if (cur && cur[k]) cur = cur[k];
          else return path;
        }
        return cur;
      };

      const getCalculatedDays = () => {
        if (durationMode === 'customDays') {
          const parsed = parseInt(customDays, 10);
          return isNaN(parsed) || parsed < 1 ? 1 : parsed;
        } else {
          const s = new Date(startDate);
          const e = new Date(nextIncomeDate);
          const diffDays = Math.ceil((e.getTime() - s.getTime()) / (1000 * 60 * 60 * 24));
          return Math.max(1, diffDays);
        }
      };

      const calculatedDays = getCalculatedDays();

      const entryCurrency = cycle?.entryCurrency || 'KRW';

      const convertVal = (amt) => {
        if (entryCurrency === curr) return amt;
        if (entryCurrency === 'USD' && curr === 'KRW') return amt * usdToKrwRate;
        if (entryCurrency === 'KRW' && curr === 'USD') return amt / usdToKrwRate;
        return amt;
      };

      const isConverted = entryCurrency !== curr;

      // ── HOME STATS — calls the shared function with the full cycle range ──
      const homeStats = getActiveCycleStats(cycle, expenses, null, null);
      const { totalSpent, balanceRemaining, daysRemaining, dailyLimit: dailySafeLimit } = homeStats;
      const cycleEndDate = homeStats.cycleEndDate || new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

      // Detect if cycle has expired
      const isCycleExpired = cycle ? (() => {
        const [ey, em, ed] = cycleEndDate.split('-').map(Number);
        const end = new Date(ey, em - 1, ed);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        return today >= end;
      })() : false;

      // State for editing cycle end date
      const [editCycleEndValue, setEditCycleEndValue] = useState(cycleEndDate);

      const handleStartCycle = (e) => {
        e.preventDefault();
        const amt = parseFloat(setupAmount.replace(/,/g, ''));
        if (!amt || amt <= 0) return;
        // Archive old cycle if exists
        if (cycle) {
          setCycleHistory([...cycleHistory, { ...cycle, is_active: false, expenses: expenses }]);
        }
        setCycle({ id: Date.now().toString(), totalAmount: amt, days: calculatedDays, startDate, entryCurrency: curr, is_active: true });
        setExpenses([]);
        setShowCycleModal(false);
      };

      // Edit the active cycle's end date — recalculates days from startDate
      const handleEditCycleEndDate = (newEndDate) => {
        if (!cycle) return;
        const [sy, sm, sd] = cycle.startDate.split('-').map(Number);
        const [ey, em, ed] = newEndDate.split('-').map(Number);
        const start = new Date(sy, sm - 1, sd);
        const end = new Date(ey, em - 1, ed);
        const newDays = Math.max(1, Math.ceil((end - start) / (1000 * 60 * 60 * 24)));
        setCycle({ ...cycle, days: newDays });
        setShowEditCycleModal(false);
      };

      // End current cycle early and prompt for new one
      const handleEndCycleEarly = () => {
        if (!cycle) return;
        setCycleHistory([...cycleHistory, { ...cycle, is_active: false, expenses: expenses }]);
        setCycle(null);
        setExpenses([]);
        setShowCycleModal(true);
      };

      const handleAddExpense = (e) => {
        e.preventDefault();
        const amt = parseInputAmount(expAmount);
        if (!amt || amt <= 0 || !expCat) return;

        if (editingExpenseId) {
          // UPDATE existing expense in-place (no duplicate)
          setExpenses(expenses.map(exp =>
            exp.id === editingExpenseId
              ? { ...exp, amount: amt, catId: expCat, note: expNote }
              : exp
          ));
        } else {
          // CREATE new expense
          setExpenses([{ id: Date.now().toString(), amount: amt, catId: expCat, note: expNote, date: new Date().toISOString() }, ...expenses]);
        }
        setExpAmount('');
        setExpNote('');
        setExpCat('');
        setEditingExpenseId(null);
        setShowExpenseModal(false);
      };

      const handleEditExpense = (exp) => {
        setEditingExpenseId(exp.id);
        setExpCat(exp.catId);
        setExpAmount(formatInputAmount(exp.amount));
        setExpNote(exp.note || '');
        setShowExpenseModal(true);
      };

      const handleDeleteExpense = (expId) => {
        setExpenses(expenses.filter(e => e.id !== expId));
      };

      const handleDeleteHistoryCycle = (cycleId, e) => {
        if (e) e.stopPropagation();
        if (window.confirm("Delete this cycle and its expenses? This can't be undone.")) {
          setCycleHistory(cycleHistory.filter(c => c.id !== cycleId));
        }
      };

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newCatName.trim()) return;
        const newCat = { id: `c-custom-${Date.now()}`, key: 'more', name: newCatName.trim(), isCustom: true };
        setCategories([...categories, newCat]);
        setNewCatName('');
        setShowAddCatModal(false);
      };

      return (
        <div className="min-h-screen bg-[#F7F9F4] text-gray-900 flex flex-col lg:flex-row">
          
          {/* DESKTOP SIDEBAR NAVIGATION */}
          <aside className="hidden lg:flex flex-col w-64 bg-[#173404] text-white p-6 justify-between min-h-screen sticky top-0 border-r border-[#265307] shadow-xl shrink-0">
            <div className="space-y-8">
              <div>
                <div className="flex items-center space-x-2">
                  <div className="w-8 h-8 rounded-xl bg-[#90C749] text-[#173404] flex items-center justify-center font-bold font-display text-lg">S</div>
                  <h1 className="text-xl font-bold tracking-tight font-display text-white">SmartWallet <span className="text-xs px-1.5 py-0.5 rounded bg-[#C0DD97] text-[#173404]">AI</span></h1>
                </div>
                <p className="text-xs text-[#C0DD97]/80 mt-1">{t('tagline')}</p>
              </div>

              <nav className="space-y-2">
                {[
                  { id: 'home', label: 'Home' },
                  { id: 'analytics', label: 'Analytics' },
                  { id: 'categories', label: 'Categories' },
                  { id: 'profile', label: 'Profile' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${activeTab === item.id ? 'bg-[#90C749] text-[#173404] font-bold shadow-md' : 'text-white/80 hover:bg-white/10'}`}
                  >
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>

              <button
                onClick={() => setShowExpenseModal(true)}
                className="w-full py-3.5 px-4 bg-[#C0DD97] hover:bg-[#90C749] text-[#173404] font-bold rounded-2xl shadow-lg transition-all text-sm flex items-center justify-center space-x-1"
              >
                <span>+ Log Expense</span>
              </button>
            </div>

            <div className="pt-4 border-t border-[#265307] text-xs text-[#C0DD97]/70">
              <span className="text-white font-semibold">Categories & Analytics Built</span>
            </div>
          </aside>

          <div className="flex-1 flex flex-col min-w-0 pb-24 lg:pb-12">
            
            <header className="sticky top-0 z-30 bg-[#F7F9F4]/90 backdrop-blur-md px-4 sm:px-8 py-4 flex items-center justify-between border-b border-gray-200">
              <div className="lg:hidden">
                <h1 className="text-lg font-bold text-[#173404] tracking-tight font-display flex items-center space-x-1.5">
                  <span>SmartWallet</span>
                  <span className="text-[10px] uppercase px-1.5 py-0.5 rounded bg-[#C0DD97] text-[#173404] font-semibold">AI</span>
                </h1>
                <p className="text-[11px] text-gray-500 font-medium">{t('tagline')}</p>
              </div>

              <div className="hidden lg:block">
                <h2 className="text-lg font-bold text-[#173404] capitalize">{activeTab} Dashboard</h2>
              </div>

              <div className="flex items-center space-x-3">
                <button
                  onClick={() => setCurr(curr === 'KRW' ? 'USD' : 'KRW')}
                  className="px-3 py-1.5 rounded-full bg-white border border-gray-200 text-xs font-bold text-[#173404] shadow-xs"
                >
                  {curr === 'KRW' ? 'KRW (₩)' : 'USD ($)'}
                </button>

                <div className="inline-flex items-center bg-white border border-gray-200 shadow-xs rounded-full p-1">
                  <button
                    onClick={() => setLang('en')}
                    className={`px-2.5 py-1 text-xs font-semibold rounded-full transition-colors ${lang === 'en' ? 'bg-[#173404] text-[#EAF3DE]' : 'text-gray-600'}`}
                  >
                    EN
                  </button>
                  <button
                    onClick={() => setLang('uz')}
                    className={`px-2.5 py-1 text-xs font-semibold rounded-full transition-colors ${lang === 'uz' ? 'bg-[#173404] text-[#EAF3DE]' : 'text-gray-600'}`}
                  >
                    UZ
                  </button>
                </div>
              </div>
            </header>

            <main className="p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6 flex-1">
              {activeTab === 'home' && (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                  <div className="lg:col-span-7 space-y-6">
                    <div className="relative overflow-hidden bg-[#173404] text-white rounded-[20px] p-6 shadow-xl border border-[#265307]">
                      <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center space-x-2">
                          <span className="w-2.5 h-2.5 rounded-full bg-[#90C749] animate-pulse"></span>
                          <span className="text-xs uppercase tracking-wider font-medium text-[#C0DD97]">{t('hero.dailySafeSpend')}</span>
                        </div>
                        <div className="inline-flex items-center space-x-1 bg-[#EAF3DE] text-[#173404] px-3 py-1 rounded-full text-xs font-semibold">
                          <span>🔥 5 day streak</span>
                        </div>
                      </div>

                      <div className="mb-4">
                        <div className="text-[36px] sm:text-[44px] font-medium leading-none font-display tracking-tight text-white">
                          {formatAmount(convertVal(dailySafeLimit), curr)}
                        </div>
                        <div className="text-xs text-[#C0DD97] mt-1.5">{t('hero.todayLabel')} &bull; {t('hero.withinBudget')}</div>

                        {isConverted && (
                          <div className="mt-2 inline-flex text-[11px] bg-[#C0DD97]/20 text-[#C0DD97] px-2.5 py-0.5 rounded border border-[#C0DD97]/30">
                            Converted (rate as of {rateLastUpdated} — 1 USD = {formatAmount(usdToKrwRate, 'KRW')})
                          </div>

                        type="text"
                        required
                        placeholder="e.g. Gym & Fitness"
                        value={newCatName}
                        onChange={(e) => setNewCatName(e.target.value)}
                        className="w-full px-4 py-2.5 bg-[#F7F9F4] border rounded-xl font-bold text-sm text-[#173404]"
                      />
                    </div>
                    <button type="submit" className="w-full py-3 bg-[#173404] text-[#EAF3DE] font-semibold rounded-xl shadow-lg text-sm">
                      Save Category
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* BLOCKING CYCLE SETUP MODAL — with custom cycle duration */}
            {showCycleModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                <div className="bg-white w-full max-w-md rounded-[24px] p-6 shadow-2xl space-y-4">
                  <div className="relative text-center space-y-1">
                    <button
                      type="button"
                      onClick={() => setShowCycleModal(false)}
                      className="absolute -right-1 -top-1 p-1 text-gray-400 hover:text-gray-700 font-bold text-lg leading-none transition-colors"
                      title="Close"
                    >
                      ✕
                    </button>
                    <h3 className="text-lg font-bold text-[#173404] pr-6">{t('cycleSetup.title')}</h3>
                    <p className="text-xs text-gray-600">{t('cycleSetup.blockingPrompt')}</p>
                  </div>
                  <form onSubmit={handleStartCycle} className="space-y-4">
                    <div>
                      <label className="text-xs font-semibold block mb-1">{t('cycleSetup.amountLabel')}</label>
                      <input
                        type="number"
                        required
                        placeholder={curr === 'KRW' ? 'e.g. 450000' : 'e.g. 350'}
                        value={setupAmount}
                        onChange={(e) => setSetupAmount(e.target.value)}
                        className="w-full px-4 py-3 bg-[#F7F9F4] border rounded-xl font-bold text-lg text-[#173404]"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold block mb-1">{t('cycleSetup.startDateLabel')}</label>
                      <input
                        type="date"
                        required
                        value={startDate}
                        onChange={(e) => setStartDate(e.target.value)}
                        className="w-full px-3 py-2 bg-[#F7F9F4] border rounded-xl text-xs font-bold text-gray-800"
                      />
                    </div>

                    {/* CUSTOM CYCLE DURATION — no fixed 7/14/30-day presets */}
                    <div className="space-y-2 pt-1 border-t border-gray-100">
                      <div className="flex items-center justify-between">
                        <label className="text-xs font-semibold text-gray-800">Custom Cycle Duration</label>
                        <div className="flex bg-[#F7F9F4] p-1 rounded-xl border border-gray-200 text-[11px]">
                          <button
                            type="button"
                            onClick={() => setDurationMode('endDate')}
                            className={`px-2.5 py-1 font-semibold rounded-lg transition-all ${
                              durationMode === 'endDate'
                                ? 'bg-[#173404] text-white shadow-xs'
                                : 'text-gray-600 hover:text-gray-900'
                            }`}
                          >
                            Next Income Date
                          </button>
                          <button
                            type="button"
                            onClick={() => setDurationMode('customDays')}
                            className={`px-2.5 py-1 font-semibold rounded-lg transition-all ${
                              durationMode === 'customDays'
                                ? 'bg-[#173404] text-white shadow-xs'
                                : 'text-gray-600 hover:text-gray-900'
                            }`}
                          >
                            Custom Days
                          </button>
                        </div>
                      </div>

                      {durationMode === 'endDate' && (
                        <div className="space-y-1.5 bg-[#EAF3DE]/40 p-3 rounded-xl border border-[#C0DD97]">
                          <label className="text-[11px] font-semibold text-[#173404] block">
                            When does your next income / allowance arrive?
                          </label>
                          <input
                            type="date"
                            required
                            min={startDate}
                            value={nextIncomeDate}
                            onChange={(e) => setNextIncomeDate(e.target.value)}
                            className="w-full px-3 py-2 bg-white border border-[#C0DD97] rounded-lg text-xs font-bold text-[#173404]"
                          />
                        </div>
                      )}

                      {durationMode === 'customDays' && (
                        <div className="space-y-1.5 bg-[#EAF3DE]/40 p-3 rounded-xl border border-[#C0DD97]">
                          <label className="text-[11px] font-semibold text-[#173404] block">
                            Type exact number of days (e.g. 8, 12, 23):
                          </label>
                          <input
                            type="number"
                            required
                            min="1"
                            max="365"
                            placeholder="e.g. 9 or 12"
                            value={customDays}
                            onChange={(e) => setCustomDays(e.target.value)}
                            className="w-full px-3 py-2 bg-white border border-[#C0DD97] rounded-lg text-xs font-bold text-[#173404]"
                          />
                        </div>
                      )}

                      <div className="flex items-center justify-between text-xs px-3 py-2 bg-[#173404] text-[#EAF3DE] rounded-xl font-medium">
                        <span>Calculated Cycle Length:</span>
                        <span className="font-bold text-sm text-[#90C749]">
                          {calculatedDays} {calculatedDays === 1 ? 'day' : 'days'}
                        </span>
                      </div>
                    </div>

                    <button type="submit" className="w-full py-3 bg-[#173404] text-[#EAF3DE] font-semibold rounded-xl shadow-lg text-sm">
                      {t('cycleSetup.confirmButton')}
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* EDIT CYCLE END DATE MODAL */}
            {showEditCycleModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
                <div className="bg-white w-full max-w-md rounded-[24px] p-6 shadow-2xl space-y-4">
                  <div className="flex justify-between items-center border-b pb-2">
                    <h3 className="text-base font-bold text-[#173404]">Edit Cycle End Date</h3>
                    <button onClick={() => setShowEditCycleModal(false)} className="text-gray-400 font-bold">✕</button>
                  </div>
                  <form onSubmit={(e) => { e.preventDefault(); handleEditCycleEndDate(editCycleEndValue); }} className="space-y-4">
                    <div>
                      <label className="text-xs font-semibold block mb-1">New Cycle End Date</label>
                      <input
                        type="date"
                        required
                        min={cycle?.startDate}
                        value={editCycleEndValue}
                        onChange={(e) => setEditCycleEndValue(e.target.value)}
                        className="w-full px-4 py-3 bg-[#F7F9F4] border border-gray-200 rounded-xl font-bold text-sm text-[#173404]"
                      />
                      <p className="text-[11px] text-gray-500 mt-1">
                        Start date: {cycle?.startDate}. Changing end date live updates days remaining and daily limit.
                      </p>
                    </div>
                    <div className="flex space-x-2">
                      <button
                        type="button"
                        onClick={() => setShowEditCycleModal(false)}
                        className="flex-1 py-3 bg-gray-100 text-gray-700 font-semibold rounded-xl text-sm"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-3 bg-[#173404] text-[#EAF3DE] font-semibold rounded-xl shadow-lg text-sm"
                      >
                        Save End Date
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {showExpenseModal && (
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
                <div className="bg-white w-full max-w-md rounded-t-[28px] sm:rounded-[24px] p-6 shadow-2xl border border-emerald-950/10 space-y-5 animate-slideUp">
                  {/* Header */}
                  <div className="flex items-center justify-between border-b border-gray-100 pb-3">
                    <div className="flex items-center space-x-2">
                      <div className={`p-2 rounded-xl ${editingExpenseId ? 'bg-amber-50 text-amber-700' : 'bg-[#EAF3DE] text-[#173404]'}`}>
                        <span className="text-lg">{editingExpenseId ? '✏️' : '+'}</span>
                      </div>
                      <h3 className="text-lg font-bold text-[#173404]">{editingExpenseId ? 'Edit Expense' : t('expense.quickAddHeader')}</h3>
                    </div>
                    <button
                      onClick={() => { setShowExpenseModal(false); setExpCat(''); setExpAmount(''); setExpNote(''); setEditingExpenseId(null); }}
                      className="p-1.5 rounded-full text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors text-lg font-bold"
                    >
                      ✕
                    </button>
                  </div>

                  <form onSubmit={handleAddExpense} className="space-y-5">
                    {/* STEP 1: Category Selector Grid */}
                    <div className="space-y-2">
                      <label className="text-xs font-semibold text-gray-700 block">{t('expense.categoryLabel')}</label>
                      <div className="grid grid-cols-4 gap-3">
                        {categories.map((cat) => {
                          const isSelected = expCat === cat.id;
                          const displayName = cat.name || t(`categories.${cat.key}`);
                          // Category icon emoji map
                          const iconMap = { utensils: '🍜', bus: '🚌', book: '📚', gamepad: '🎮', shopping: '🛒', receipt: '🧾', sparkles: '✨', more: '📦' };
                          const icon = iconMap[cat.key] || '📦';
                          return (
                            <button
                              type="button"
                              key={cat.id}
                              onClick={() => setExpCat(cat.id)}
                              className="flex flex-col items-center space-y-1.5 group"
                            >
                              <div
                                className={`w-13 h-13 rounded-full flex items-center justify-center text-xl transition-all ${
                                  isSelected
                                    ? 'bg-[#173404] text-white ring-[3px] ring-[#C0DD97] scale-110 shadow-lg'
                                    : 'bg-[#EAF3DE] text-[#173404] hover:bg-[#C0DD97] hover:scale-105'
                                }`}
                                style={{ width: '52px', height: '52px' }}
                              >
                                {icon}
                              </div>
                              <span
                                className={`text-[10px] font-medium text-center leading-tight w-full truncate ${
                                  isSelected ? 'text-[#173404] font-bold' : 'text-gray-500'
                                }`}
                              >
                                {displayName}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                      {!expCat && (
                        <p className="text-[10px] text-gray-400 italic">Tap a category above to select</p>
                      )}
                    </div>

                    {/* STEP 2: Amount Input with live dot formatting */}
                    <div className="space-y-1.5">
                      <label className="text-xs font-semibold text-gray-700 block">{t('expense.amountLabel')}</label>
                      <div className="relative">
                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-[#173404] font-bold text-xl">
                          {curr === 'KRW' ? '₩' : '$'}
                        </span>
                        <input
                          type="text"
                          inputMode="numeric"
                          placeholder="0"
                          value={expAmount}
                          onChange={(e) => setExpAmount(formatInputAmount(e.target.value))}
                          className="w-full pl-10 pr-4 py-3 bg-[#F7F9F4] border border-gray-200 rounded-xl font-bold text-2xl text-[#173404] focus:outline-none focus:ring-2 focus:ring-[#173404] transition-all"
                        />
                      </div>
                    </div>

                    {/* STEP 3: Optional Note */}
                    <div className="space-y-1.5">
                      <label className="text-xs font-semibold text-gray-700 block">{t('expense.noteLabel')}</label>
                      <input
                        type="text"
                        placeholder="e.g. Campus cafeteria lunch"
                        value={expNote}
                        onChange={(e) => setExpNote(e.target.value)}
                        className="w-full px-3.5 py-2.5 bg-[#F7F9F4] border border-gray-200 rounded-xl text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#173404] transition-all"
                      />
                    </div>

                    {/* STEP 4: Submit — disabled until category + amount filled */}
                    <button
                      type="submit"
                      disabled={!expCat || !parseInputAmount(expAmount)}
                      className={`w-full py-3.5 font-semibold rounded-xl shadow-lg text-sm transition-all flex items-center justify-center space-x-2 ${
                        expCat && parseInputAmount(expAmount)
                          ? 'bg-[#173404] hover:bg-[#234a08] text-[#EAF3DE] cursor-pointer'
                          : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                      }`}
                    >
                      <span>{t('expense.saveButton')}</span>
                      {expCat && parseInputAmount(expAmount) > 0 && (
                        <span className="text-xs opacity-70">({formatAmount(parseInputAmount(expAmount), curr)})</span>
                      )}
                    </button>
                  </form>
                </div>
              </div>
            )}

            <div className="fixed bottom-0 left-0 right-0 z-40 lg:hidden max-w-md mx-auto px-4 pb-4">
              <div className="bg-[#173404] text-white rounded-full shadow-2xl p-2 flex items-center justify-around">
                <button onClick={() => setActiveTab('home')} className={`text-xs font-semibold px-4 py-1.5 rounded-full ${activeTab === 'home' ? 'bg-[#90C749] text-[#173404]' : 'text-white/80'}`}>
                  Home
                </button>
                <button onClick={() => setShowExpenseModal(true)} className="w-12 h-12 bg-[#90C749] text-[#173404] rounded-full flex items-center justify-center font-bold text-xl shadow-lg -mt-5 border-4 border-[#F7F9F4]">
                  +
                </button>
                <button onClick={() => setActiveTab('profile')} className={`text-xs font-semibold px-4 py-1.5 rounded-full ${activeTab === 'profile' ? 'bg-[#90C749] text-[#173404]' : 'text-white/80'}`}>
                  Profile
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
